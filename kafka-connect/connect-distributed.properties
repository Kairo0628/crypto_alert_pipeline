bootstrap.servers=broker:9092

key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.SchemalessJsonConverter

key.converter.schemas.enable=false
value.converter.schemas.enable=false

plugin.path=/opt/kafka/connect-plugins

offset.flush.interval.ms=10000

group.id=postgres-sink

offset.storage.topic=postgres-sink-offsets
offset.storage.replication.factor=1
offset.storage.partitions=3

config.storage.topic=postgres-sink-configs
config.storage.replication.factor=1

status.storage.topic=postgres-sink-status
status.storage.replication.factor=1
status.storage.partitions=3 

listeners=HTTP://connect:8083
