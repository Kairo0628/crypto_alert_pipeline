x-kafka-volumes:
  &kafka-volumes
  volumes:
    - ./kafka-logs/data:/logs/data
    - ./kafka-logs/metadata:/logs/metadata

services:
  kafka-init:
    image: busybox
    container_name: kafka-init
    <<: *kafka-volumes
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -v -p /logs/{data,metadata}

  broker:
    <<: *kafka-volumes
    image: apache/kafka:4.2.1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker:9092,EXTERNAL://localhost:9093

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: broker:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /logs/data
      KAFKA_METADATA_LOG_DIR: /logs/metadata
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # 1024 * 1024 * 1024 = 1GB
      KAFKA_LOG_SEGMENT_BYTES: 134217728 # 1024 * 1024 * 128 = 128MB
      KAFKA_LOG_RETENTION_HOURS: 168 # 24 * 7 = 7 Days

      # 수집하려는 종목이 4개이므로 4개의 파티션 사용
      KAFKA_NUM_PARTITIONS: 4

      # 브로커가 1개이므로 복제본에 대한 설정은 1로 지정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 컨슈머가 1개이므로 리밸런싱 지연 시간 필요 없음
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 3s
      retries: 5

  connect:
    container_name: connect
    build: ./kafka-connect
    ports:
      - "8083:8083"
    command: /opt/kafka/bin/connect-distributed.sh /opt/kafka/config/connect-distributed.properties
    depends_on:
      broker:
        condition: service_healthy

  redpanda-console:
    image: redpandadata/console:v2.8.15
    container_name: redpanda-console
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: broker:9092
    depends_on:
      broker:
        condition: service_healthy

  producer:
    container_name: producer
    build: ./kafka
    command: python producer.py
    depends_on:
      broker:
        condition: service_healthy

  kafka_anomaly:
    container_name: kafka_anomaly
    build: ./kafka
    command: python kafka_anomaly.py
    depends_on:
      broker:
        condition: service_healthy
      producer:
        condition: service_started

  spark_anomaly:
    container_name: spark
    build: ./spark
    command: /opt/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1 /opt/spark/spark_app/spark_anomaly.py
    ports:
      - "4040:4040"
    volumes:
      - ./spark-checkpoint:/opt/spark/spark-checkpoint
    depends_on:
      broker:
        condition: service_healthy
      producer:
        condition: service_started
    restart: always

  postgres:
    image: postgres:18.6
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - ./postgres-db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres

  adminer:
    image: adminer:6
    container_name: adminer
    ports:
      - 8088:8080
